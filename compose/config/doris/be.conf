# ============================================================
# Apache Doris BE Configuration (4.1.1)
# AI Data Platform (mds-mcp) - Development Environment
# ============================================================
# Reference: https://doris.apache.org/docs/admin-manual/config/be-config
# ============================================================

# ============================================================
# Network
# ============================================================
be_port = 9060
webserver_port = 8040
brpc_port = 9050
heartbeat_service_port = 9051

# ============================================================
# Storage
# ============================================================
storage_root_path = /opt/apache-doris/be/storage

# ============================================================
# Memory
# ============================================================
JAVA_OPTS_FOR_JDK_17 = "-Xmx1024m -Xms512m -XX:+UseG1GC"
mem_limit = 80%

# ============================================================
# Compaction
# ============================================================
compaction_task_num_per_disk = 2
max_base_compaction_threads = 2
max_cumu_compaction_threads = 4

# ============================================================
# Vector & Inverted Index
# ============================================================
enable_inverted_index_compaction = true

# ============================================================
# Logging
# ============================================================
sys_log_level = INFO
priority_networks = 172.21.0.0/24
priority_networks = 172.21.0.0/24
priority_networks = 172.21.0.0/24
priority_networks = 172.21.0.0/24
priority_networks = 172.25.0.0/24
priority_networks = 172.25.0.0/24
priority_networks = 172.25.0.0/24
