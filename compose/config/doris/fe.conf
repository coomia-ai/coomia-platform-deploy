# ============================================================
# Apache Doris FE Configuration (4.1.1)
# AI Data Platform (mds-mcp) - Development Environment
# ============================================================
# Reference: https://doris.apache.org/docs/admin-manual/config/fe-config
# ============================================================

# ============================================================
# Network
# ============================================================
query_port = 9030
http_port = 8030
rpc_port = 9020
edit_log_port = 9010

# ============================================================
# Metadata
# ============================================================
meta_dir = /opt/apache-doris/fe/doris-meta

# Phase C delivery verifier reconstructs Flink 2PC labels after checkpoint
# completion. Keep streaming labels beyond the seven-day evidence recovery
# objective, and disable the lower count-based eviction threshold.
streaming_label_keep_max_second = 691200
label_num_threshold = -1

# ============================================================
# Memory
# ============================================================
JAVA_OPTS_FOR_JDK_17 = "-Xmx4096m -Xms2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/opt/apache-doris/fe/log/fe_oom.hprof"

# ============================================================
# Query Settings
# ============================================================
max_query_timeout = 3600
default_query_timeout = 300

# ============================================================
# Storage Settings (1 replica for dev, 3 for production)
# ============================================================
default_replication_num = 1
min_replication_num_per_tablet = 1

# ============================================================
# Logging
# ============================================================
sys_log_level = INFO
enable_audit_log = false
priority_networks = 172.21.0.0/24
priority_networks = 172.21.0.0/24
priority_networks = 172.21.0.0/24
priority_networks = 172.21.0.0/24
priority_networks = 172.25.0.0/24
priority_networks = 172.25.0.0/24
priority_networks = 172.25.0.0/24
