# Optional local-only administration ports. Do not expose these ports publicly.
services:
  postgres:
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
  minio:
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
  nessie:
    ports: ["127.0.0.1:${NESSIE_PORT:-19120}:19120"]
  tugraph:
    ports:
      - "127.0.0.1:${TUGRAPH_HTTP_PORT:-7070}:7070"
      - "127.0.0.1:${TUGRAPH_BOLT_PORT:-7687}:7687"
  doris-fe:
    ports:
      - "127.0.0.1:${DORIS_FE_HTTP_PORT:-8030}:8030"
      - "127.0.0.1:${DORIS_FE_MYSQL_PORT:-9030}:9030"
