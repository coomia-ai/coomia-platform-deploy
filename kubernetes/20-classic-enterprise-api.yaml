# Reference-only isolated Enterprise application workload.
# Render with render-enterprise.sh; this file is never applied directly.
apiVersion: v1
kind: Namespace
metadata:
  name: ${CLASSIC_ENTERPRISE_NAMESPACE}
  labels:
    coomia.com/role: classic-enterprise
    coomia.com/isolation: dedicated
    coomia.com/core-revision: "${CLASSIC_ENTERPRISE_CORE_REVISION}"
    coomia.com/enterprise-revision: "${CLASSIC_ENTERPRISE_ENTERPRISE_REVISION}"
    coomia.com/deployment-revision: "${CLASSIC_ENTERPRISE_DEPLOYMENT_REVISION}"
    coomia.com/release-inputs: "${CLASSIC_ENTERPRISE_RELEASE_INPUTS_LABEL}"
  annotations:
    coomia.com/release-inputs: "${CLASSIC_ENTERPRISE_RELEASE_INPUTS}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: classic-enterprise-api-config
  namespace: ${CLASSIC_ENTERPRISE_NAMESPACE}
  labels:
    app.kubernetes.io/name: classic-enterprise-api
    app.kubernetes.io/part-of: coomia-classic-enterprise
    coomia.com/data-scope: enterprise
data:
  BUILD_PROFILE: "customer"
  EDITION: "enterprise"
  COOMIA_CONTRACT_MODE: "open_core"
  LICENSE_ENFORCEMENT: "true"
  LICENSE_VERIFY_MODE: "online"
  LICENSE_STORE_DIR: "/var/lib/coomia-enterprise"
  COOMIA_SCHEMA_BASELINE: "/etc/coomia/baseline/schema-baseline.json"
  FLINK_RUNTIME: "kubernetes"
  FLINK_K8S_NAMESPACE: "${CLASSIC_ENTERPRISE_FLINK_NAMESPACE}"
  OBJECT_STORAGE_IAM_PROVIDER: "${CLASSIC_ENTERPRISE_OBJECT_STORAGE_IAM_PROVIDER}"
  DEBUG: "false"
  OTEL_ENABLED: "false"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: classic-enterprise-license
  namespace: ${CLASSIC_ENTERPRISE_NAMESPACE}
  labels:
    app.kubernetes.io/name: classic-enterprise-api
    coomia.com/data-scope: enterprise-license
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: classic-enterprise-api
  namespace: ${CLASSIC_ENTERPRISE_NAMESPACE}
  labels:
    app.kubernetes.io/name: classic-enterprise-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classic-enterprise-api
  namespace: ${CLASSIC_ENTERPRISE_NAMESPACE}
  labels:
    app.kubernetes.io/name: classic-enterprise-api
    app.kubernetes.io/part-of: coomia-classic-enterprise
    coomia.com/edition: enterprise
    coomia.com/isolation: dedicated
    coomia.com/core-revision: "${CLASSIC_ENTERPRISE_CORE_REVISION}"
    coomia.com/enterprise-revision: "${CLASSIC_ENTERPRISE_ENTERPRISE_REVISION}"
    coomia.com/deployment-revision: "${CLASSIC_ENTERPRISE_DEPLOYMENT_REVISION}"
    coomia.com/release-inputs: "${CLASSIC_ENTERPRISE_RELEASE_INPUTS_LABEL}"
  annotations:
    coomia.com/release-inputs: "${CLASSIC_ENTERPRISE_RELEASE_INPUTS}"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: classic-enterprise-api
      coomia.com/edition: enterprise
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classic-enterprise-api
        app.kubernetes.io/part-of: coomia-classic-enterprise
        coomia.com/edition: enterprise
        coomia.com/isolation: dedicated
        coomia.com/core-revision: "${CLASSIC_ENTERPRISE_CORE_REVISION}"
        coomia.com/enterprise-revision: "${CLASSIC_ENTERPRISE_ENTERPRISE_REVISION}"
        coomia.com/deployment-revision: "${CLASSIC_ENTERPRISE_DEPLOYMENT_REVISION}"
        coomia.com/release-inputs: "${CLASSIC_ENTERPRISE_RELEASE_INPUTS_LABEL}"
      annotations:
        coomia.com/release-inputs: "${CLASSIC_ENTERPRISE_RELEASE_INPUTS}"
    spec:
      serviceAccountName: classic-enterprise-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
${CLASSIC_ENTERPRISE_API_IMAGE_PULL_SECRETS_BLOCK}
      containers:
        - name: api
          image: ${CLASSIC_ENTERPRISE_API_IMAGE}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - { containerPort: 8050, name: http }
          envFrom:
            - configMapRef: { name: classic-enterprise-api-config }
            - secretRef: { name: classic-enterprise-api-secret }
          volumeMounts:
            - name: license
              mountPath: /var/lib/coomia-enterprise
            - name: release-baseline
              mountPath: /etc/coomia/baseline
              readOnly: true
          readinessProbe:
            httpGet: { path: /ready, port: 8050 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health, port: 8050 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { cpu: "4", memory: 4Gi }
      volumes:
        - name: license
          persistentVolumeClaim:
            claimName: classic-enterprise-license
        - name: release-baseline
          configMap:
            name: classic-enterprise-schema-baseline
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: classic-enterprise-api-ingress
  namespace: ${CLASSIC_ENTERPRISE_NAMESPACE}
  labels:
    app.kubernetes.io/name: classic-enterprise-api
    coomia.com/edition: enterprise
    coomia.com/isolation: dedicated
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: classic-enterprise-api
      coomia.com/edition: enterprise
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
${CLASSIC_ENTERPRISE_API_INGRESS_POLICY_BLOCK}
      ports:
        - protocol: TCP
          port: 8050
---
apiVersion: v1
kind: Service
metadata:
  name: classic-enterprise-api
  namespace: ${CLASSIC_ENTERPRISE_NAMESPACE}
  labels:
    app.kubernetes.io/name: classic-enterprise-api
    app.kubernetes.io/part-of: coomia-classic-enterprise
spec:
  selector:
    app.kubernetes.io/name: classic-enterprise-api
    coomia.com/edition: enterprise
  ports:
    - { name: http, port: 8050, targetPort: 8050 }
${CLASSIC_ENTERPRISE_INGRESS_BLOCK}
